<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Benchmark Database Connection Pooling</title>
  <desc id="desc">Before and after bar chart comparing MySQL request latency without and with connection pooling.</desc>
  <rect width="1280" height="720" fill="#f8fafc"/>
  <rect x="44" y="36" width="1192" height="648" rx="18" fill="#ffffff" stroke="#dbe4f0"/>

  <text x="78" y="88" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2a60">Benchmark Database Connection Pooling</text>
  <text x="78" y="124" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#526177">30 phiên đồng thời, truy vấn SELECT 1, so sánh tạo kết nối mới và pool_size=15</text>

  <rect x="78" y="155" width="810" height="420" rx="14" fill="#f8fafc" stroke="#dbe4f0"/>
  <text x="108" y="198" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1f2a60">Latency request MySQL</text>
  <text x="108" y="224" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526177">Đơn vị: milliseconds, trục Y tối đa 40ms</text>

  <line x1="150" y1="520" x2="820" y2="520" stroke="#22304a" stroke-width="2"/>
  <line x1="150" y1="200" x2="150" y2="520" stroke="#22304a" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#65758b">
    <line x1="150" y1="520" x2="820" y2="520" stroke="#e2e8f0"/>
    <text x="116" y="525">0</text>
    <line x1="150" y1="440" x2="820" y2="440" stroke="#e2e8f0"/>
    <text x="108" y="445">10</text>
    <line x1="150" y1="360" x2="820" y2="360" stroke="#e2e8f0"/>
    <text x="108" y="365">20</text>
    <line x1="150" y1="280" x2="820" y2="280" stroke="#e2e8f0"/>
    <text x="108" y="285">30</text>
    <line x1="150" y1="200" x2="820" y2="200" stroke="#e2e8f0"/>
    <text x="108" y="205">40</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="260" y="343.2" width="86" height="176.8" rx="7" fill="#ef4444"/>
    <rect x="365" y="438.4" width="86" height="81.6" rx="7" fill="#16a34a"/>
    <text x="303" y="326" font-size="22" font-weight="700" fill="#991b1b">22.1ms</text>
    <text x="408" y="421" font-size="22" font-weight="700" fill="#166534">10.2ms</text>
    <text x="355" y="555" font-size="17" font-weight="700" fill="#25324d">Request TB</text>
    <text x="355" y="581" font-size="14" fill="#526177">Nhanh gấp 2.2 lần</text>

    <rect x="585" y="240.8" width="86" height="279.2" rx="7" fill="#ef4444"/>
    <rect x="690" y="407.2" width="86" height="112.8" rx="7" fill="#16a34a"/>
    <text x="628" y="224" font-size="22" font-weight="700" fill="#991b1b">34.9ms</text>
    <text x="733" y="390" font-size="22" font-weight="700" fill="#166534">14.1ms</text>
    <text x="680" y="555" font-size="17" font-weight="700" fill="#25324d">Request P95</text>
    <text x="680" y="581" font-size="14" fill="#526177">Giảm 59.6% độ trễ</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="675" y="176" width="18" height="18" rx="4" fill="#ef4444"/>
    <text x="702" y="190" font-size="15" fill="#25324d">Không Pool</text>
    <rect x="675" y="203" width="18" height="18" rx="4" fill="#16a34a"/>
    <text x="702" y="217" font-size="15" fill="#25324d">Có Pool</text>
  </g>

  <rect x="925" y="155" width="265" height="420" rx="14" fill="#f1f5f9" stroke="#d4dde9"/>
  <text x="955" y="198" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1f2a60">Tổng kết</text>
  <g font-family="Arial, Helvetica, sans-serif" fill="#25324d">
    <text x="955" y="250" font-size="16">Pool size</text>
    <text x="1160" y="250" font-size="24" font-weight="700" text-anchor="end">15</text>
    <text x="955" y="304" font-size="16">Phiên đồng thời</text>
    <text x="1160" y="304" font-size="24" font-weight="700" text-anchor="end">30</text>
    <text x="955" y="358" font-size="16">Error rate</text>
    <text x="1160" y="358" font-size="24" font-weight="700" text-anchor="end">0%</text>
    <text x="955" y="412" font-size="16">Query</text>
    <text x="1160" y="412" font-size="21" font-weight="700" text-anchor="end">SELECT 1</text>
  </g>

  <rect x="955" y="452" width="205" height="82" rx="10" fill="#ffffff" stroke="#dbe4f0"/>
  <text x="975" y="482" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#1f2a60">Kết luận slide</text>
  <text x="975" y="506" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#526177">Pooling giảm overhead kết nối</text>
  <text x="975" y="524" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#526177">khi nhiều sinh viên thao tác DB.</text>

  <rect x="78" y="604" width="1112" height="50" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="102" y="635" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1f2a60">Ghi chú:</text>
  <text x="172" y="635" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#25324d">Số liệu đo thật request đầy đủ: lấy connection, chạy SELECT 1, fetch kết quả và đóng connection.</text>
</svg>

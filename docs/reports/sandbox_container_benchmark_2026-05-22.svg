<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Benchmark Sandbox Container</title>
  <desc id="desc">Bar chart of measured Docker sandbox container lifecycle timings.</desc>
  <rect width="1280" height="720" fill="#f8fafc"/>
  <rect x="44" y="36" width="1192" height="648" rx="18" fill="#ffffff" stroke="#dbe4f0"/>

  <text x="78" y="88" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2a60">Benchmark Sandbox Container</text>
  <text x="78" y="124" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#526177">Đo thật Docker lifecycle bằng container tạm, image sandbox my-dev-env:v2</text>

  <rect x="78" y="155" width="710" height="405" rx="14" fill="#f8fafc" stroke="#dbe4f0"/>
  <text x="108" y="198" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#1f2a60">Image đã cache local</text>
  <text x="108" y="224" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#526177">20 vòng đo/tình huống, trục Y tối đa 0.20s</text>

  <line x1="150" y1="505" x2="730" y2="505" stroke="#22304a" stroke-width="2"/>
  <line x1="150" y1="250" x2="150" y2="505" stroke="#22304a" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#65758b">
    <line x1="150" y1="505" x2="730" y2="505" stroke="#e2e8f0"/>
    <text x="112" y="510">0.00</text>
    <line x1="150" y1="441.25" x2="730" y2="441.25" stroke="#e2e8f0"/>
    <text x="112" y="446">0.05</text>
    <line x1="150" y1="377.5" x2="730" y2="377.5" stroke="#e2e8f0"/>
    <text x="112" y="382">0.10</text>
    <line x1="150" y1="313.75" x2="730" y2="313.75" stroke="#e2e8f0"/>
    <text x="112" y="318">0.15</text>
    <line x1="150" y1="250" x2="730" y2="250" stroke="#e2e8f0"/>
    <text x="112" y="255">0.20</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <rect x="210" y="387.7" width="96" height="117.3" rx="7" fill="#2563eb"/>
    <text x="258" y="370" font-size="23" font-weight="700" fill="#1e3a8a">0.092s</text>
    <text x="258" y="540" font-size="15" font-weight="700" fill="#25324d">Đang chạy</text>
    <text x="258" y="563" font-size="13" fill="#526177">P95 0.103s</text>

    <rect x="390" y="349.45" width="96" height="155.55" rx="7" fill="#f59e0b"/>
    <text x="438" y="332" font-size="23" font-weight="700" fill="#92400e">0.122s</text>
    <text x="438" y="540" font-size="15" font-weight="700" fill="#25324d">Đã dừng</text>
    <text x="438" y="563" font-size="13" fill="#526177">P95 0.133s</text>

    <rect x="570" y="308.65" width="96" height="196.35" rx="7" fill="#16a34a"/>
    <text x="618" y="291" font-size="23" font-weight="700" fill="#166534">0.154s</text>
    <text x="618" y="540" font-size="15" font-weight="700" fill="#25324d">Tạo mới</text>
    <text x="618" y="563" font-size="13" fill="#526177">P95 0.162s</text>
  </g>

  <rect x="825" y="155" width="365" height="405" rx="14" fill="#fff7ed" stroke="#fed7aa"/>
  <text x="855" y="198" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#7c2d12">Chưa có image</text>
  <text x="855" y="224" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#9a3412">Đo 1 lần pull alpine:3.20 qua Internet</text>
  <line x1="895" y1="505" x2="1135" y2="505" stroke="#7c2d12" stroke-width="2"/>
  <line x1="895" y1="250" x2="895" y2="505" stroke="#7c2d12" stroke-width="2"/>
  <rect x="975" y="261.3" width="82" height="243.7" rx="7" fill="#ea580c"/>
  <text x="1016" y="244" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" text-anchor="middle" fill="#9a3412">4.779s</text>
  <text x="1016" y="540" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#7c2d12">Pull image</text>
  <text x="1016" y="563" font-family="Arial, Helvetica, sans-serif" font-size="13" text-anchor="middle" fill="#9a3412">phụ thuộc Internet</text>

  <rect x="78" y="596" width="1112" height="54" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="102" y="628" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1f2a60">Kết luận slide:</text>
  <text x="242" y="628" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#25324d">Với image sandbox đã cache local, Docker lifecycle đạt 0.09-0.15s, thấp hơn mục tiêu &lt; 2s.</text>
  <text x="102" y="665" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#65758b">Lưu ý: đây là benchmark Docker lifecycle, chưa bao gồm toàn bộ setup user, DB, mount workspace và bước chờ SSH trong production.</text>
</svg>

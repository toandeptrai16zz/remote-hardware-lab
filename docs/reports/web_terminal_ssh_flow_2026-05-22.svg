<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Terminal SSH Tren Web</title>
  <desc id="desc">Diagram showing xterm.js through Flask-SocketIO and Paramiko SSH into a sandbox container.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#24324a"/>
    </marker>
  </defs>
  <rect width="1280" height="720" fill="#f8fafc"/>
  <rect x="46" y="38" width="1188" height="644" rx="18" fill="#ffffff" stroke="#dbe4f0"/>

  <text x="80" y="92" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2a60">Terminal SSH Trên Web</text>
  <text x="80" y="128" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#526177">Cầu nối xterm.js → Flask-SocketIO → Paramiko SSH → Sandbox Container</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="90" y="190" width="215" height="130" rx="14" fill="#eef2ff" stroke="#6476d9"/>
    <text x="197.5" y="228" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2a60">Browser</text>
    <text x="197.5" y="258" text-anchor="middle" font-size="16" fill="#25324d">xterm.js</text>
    <text x="197.5" y="285" text-anchor="middle" font-size="13" fill="#526177">terminal.onData()</text>

    <rect x="385" y="190" width="225" height="130" rx="14" fill="#f0fdf4" stroke="#16a34a"/>
    <text x="497.5" y="228" text-anchor="middle" font-size="22" font-weight="700" fill="#166534">Socket.IO</text>
    <text x="497.5" y="258" text-anchor="middle" font-size="16" fill="#25324d">namespace /terminal</text>
    <text x="497.5" y="285" text-anchor="middle" font-size="13" fill="#526177">events: input, output, resize</text>

    <rect x="690" y="190" width="225" height="130" rx="14" fill="#eff6ff" stroke="#2563eb"/>
    <text x="802.5" y="228" text-anchor="middle" font-size="22" font-weight="700" fill="#1e3a8a">Flask Backend</text>
    <text x="802.5" y="258" text-anchor="middle" font-size="16" fill="#25324d">sockets/terminal.py</text>
    <text x="802.5" y="285" text-anchor="middle" font-size="13" fill="#526177">session keyed by request.sid</text>

    <rect x="995" y="190" width="195" height="130" rx="14" fill="#fff7ed" stroke="#f59e0b"/>
    <text x="1092.5" y="228" text-anchor="middle" font-size="22" font-weight="700" fill="#92400e">Container</text>
    <text x="1092.5" y="258" text-anchor="middle" font-size="16" fill="#25324d">sshd + shell</text>
    <text x="1092.5" y="285" text-anchor="middle" font-size="13" fill="#526177">xterm-256color PTY</text>

    <line x1="305" y1="242" x2="380" y2="242" stroke="#24324a" stroke-width="2.2" marker-end="url(#arrow)"/>
    <text x="342.5" y="226" text-anchor="middle" font-size="13" fill="#25324d">input</text>
    <line x1="380" y1="277" x2="310" y2="277" stroke="#24324a" stroke-width="2.2" marker-end="url(#arrow)"/>
    <text x="342.5" y="299" text-anchor="middle" font-size="13" fill="#25324d">output</text>

    <line x1="610" y1="242" x2="685" y2="242" stroke="#24324a" stroke-width="2.2" marker-end="url(#arrow)"/>
    <text x="647.5" y="226" text-anchor="middle" font-size="13" fill="#25324d">emit/input</text>
    <line x1="685" y1="277" x2="615" y2="277" stroke="#24324a" stroke-width="2.2" marker-end="url(#arrow)"/>
    <text x="647.5" y="299" text-anchor="middle" font-size="13" fill="#25324d">emit/output</text>

    <line x1="915" y1="242" x2="990" y2="242" stroke="#24324a" stroke-width="2.2" marker-end="url(#arrow)"/>
    <text x="952.5" y="226" text-anchor="middle" font-size="13" fill="#25324d">Paramiko SSH</text>
    <line x1="990" y1="277" x2="920" y2="277" stroke="#24324a" stroke-width="2.2" marker-end="url(#arrow)"/>
    <text x="952.5" y="299" text-anchor="middle" font-size="13" fill="#25324d">stdout/stderr</text>
  </g>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="90" y="382" width="342" height="150" rx="14" fill="#f8fafc" stroke="#dbe4f0"/>
    <text x="120" y="422" font-size="20" font-weight="700" fill="#1f2a60">Luồng nhập</text>
    <text x="120" y="456" font-size="15" fill="#25324d">1. Người dùng gõ trong xterm.js</text>
    <text x="120" y="484" font-size="15" fill="#25324d">2. Frontend emit event input</text>
    <text x="120" y="512" font-size="15" fill="#25324d">3. Backend gọi chan.send(data)</text>

    <rect x="469" y="382" width="342" height="150" rx="14" fill="#f8fafc" stroke="#dbe4f0"/>
    <text x="499" y="422" font-size="20" font-weight="700" fill="#1f2a60">Luồng xuất</text>
    <text x="499" y="456" font-size="15" fill="#25324d">1. Background task đọc SSH channel</text>
    <text x="499" y="484" font-size="15" fill="#25324d">2. recv(1024) bytes mỗi lần đọc</text>
    <text x="499" y="512" font-size="15" fill="#25324d">3. Emit output về đúng socket room</text>

    <rect x="848" y="382" width="342" height="150" rx="14" fill="#f8fafc" stroke="#dbe4f0"/>
    <text x="878" y="422" font-size="20" font-weight="700" fill="#1f2a60">PTY resize</text>
    <text x="878" y="456" font-size="15" fill="#25324d">1. xterm fit theo kích thước panel</text>
    <text x="878" y="484" font-size="15" fill="#25324d">2. Frontend emit event resize</text>
    <text x="878" y="512" font-size="15" fill="#25324d">3. Backend gọi chan.resize_pty()</text>
  </g>

  <rect x="90" y="580" width="1100" height="60" rx="10" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="118" y="615" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#1f2a60">Ghi chú đúng code:</text>
  <text x="272" y="615" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#25324d">event là input/output/resize; terminal đọc chunk 1024 bytes. Chunk 4096 bytes thuộc Serial Monitor.</text>
  <text x="90" y="668" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#65758b">Nguồn: static/js/ide.js và sockets/terminal.py.</text>
</svg>
